<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vibe for Two</title>
<meta name="description" content="SUN과 BEE의 바이브 코딩 스터디">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="bgscope" aria-hidden="true"></div>
  <aside class="side">
    <button class="brand brand-btn" data-act="home" aria-label="메인 화면으로">
      <span class="logo">Vibe for Two</span>
    </button>
    <nav class="snav" aria-label="사이트 메뉴">
      <button class="navlink" data-act="works" aria-current="false"><span class="ico-grid" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Works<span class="navcount" id="workcount"></span></button>
    </nav>
    <div class="pgroup">
      <nav class="plist" id="plist" aria-label="프로젝트 목록"></nav>
      <button class="add-proj" data-act="add-project" hidden>+ 새 프로젝트</button>
    </div>
    <div class="side-foot">
      <p class="whoami" id="whoami" hidden></p>
      <button class="btn login-side" data-act="open-login">로그인</button>
      <p class="savenote" id="savenote"></p>
    </div>
  </aside>
  <span class="edge-hint" aria-hidden="true"></span>
  <button class="menu-btn" data-act="toggle-side" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  <main class="main" id="main"></main>
</div>
<button class="login-top" data-act="open-login">로그인</button>
<p class="credit credit-home">Designed and built by Rain</p>
<div class="modal" id="login" hidden>
  <div class="modal-bg" data-act="close-login"></div>
  <div class="login-card" id="authcard" role="dialog" aria-modal="true" aria-label="로그인"></div>
</div>
<div class="modal" id="workmodal" hidden>
  <div class="modal-bg" data-act="close-work"></div>
  <div class="login-card work-card" id="workcard" role="dialog" aria-modal="true" aria-label="작업"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>window.VFT_ASSETS={scope:'assets/scope.jpg',mask:'assets/scope-mask.png'};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="glyph.js"></script>
<script src="app.js"></script>
</body>
</html>
